# Low-RAM host (~7.7 GB, often <1 GB free): keep the daemon's footprint small.
# Serial GC uses far fewer threads + less native/virtual memory than G1, which
# is what kept exhausting physical RAM during release dexing on this machine.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=192m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# Project (E:) and the Dart pub cache (C:) live on different drives. Kotlin's
# incremental compiler can't relativize paths across drive roots on Windows and
# crashes closing its caches, so disable incremental Kotlin compilation here.
kotlin.incremental=false
# Low-RAM host (7 GB): cap concurrent Gradle workers to curb peak memory during
# release dexing/R8 so the daemon JVM doesn't exhaust system commit and crash.
org.gradle.workers.max=2
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
