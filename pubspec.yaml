name: mulinda_mobile
description: "Mulinda — AI personal financial assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (Google sign-in config + push messaging)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2
  app_links: ^6.3.2

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Localization (Chichewa default + English)
  easy_localization: ^3.0.7

  # Permissions + media (receipt scanning)
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_sms_inbox: ^1.0.4

  # Notifications (bill / loan reminders)
  flutter_local_notifications: ^18.0.1

  # Auth
  google_sign_in: ^6.2.2

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.4.1

  # Sharing + file system (transaction receipt export)
  share_plus: ^10.1.3
  path_provider: ^2.1.5

  # First-run / onboarding gate
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

# App launcher icons generated from assets/logo.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#2ec4b6"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48

# Native launch screen generated from the logo:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: "assets/logo.png"
  android_12:
    color: "#ffffff"
    image: "assets/logo.png"
  android: true
  ios: false
  web: false
